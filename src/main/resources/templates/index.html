<!DOCTYPE html>
<!--
  메인 랜딩 페이지
  - 히어로(브랜드 스테이트먼트 + 주요 CTA)
  - home-quick(아이콘 바로가기 카드 4개)
-->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<body>
<main class="page-shell" layout:fragment="content">

  <section class="hero">
    <div class="hero__content">
      <span class="hero__eyebrow"><i class="bi bi-stars"></i> 풋살 운영 플랫폼</span>
      <h1 class="hero__title">정석대로 뛰고,<br>깔끔하게 이긴다</h1>
      <p class="hero__subtitle">팀 운영·구장 예약·커뮤니티를 한 화면에서. 복잡한 스케줄과 정보를 단순하게 정리했습니다.</p>
      <div class="hero__actions">
        <a class="btn btn--primary btn--lg" href="/payment/placelist">
          <i class="bi bi-calendar-check"></i> 구장 예약 시작
        </a>
        <a class="btn btn--secondary btn--lg" href="/teammanage/teammanage">
          <i class="bi bi-people"></i> 팀 둘러보기
        </a>
      </div>
    </div>
  </section>

  <section class="home-quick">
    <a href="/teammanage/teammanage">
      <span class="home-quick__icon"><i class="bi bi-people"></i></span>
      <span>
        <span class="home-quick__label">팀 관리</span>
        <span class="home-quick__desc">생성·멤버·전적을 한 곳에서</span>
      </span>
    </a>
    <a href="/payment/placelist">
      <span class="home-quick__icon"><i class="bi bi-calendar-check"></i></span>
      <span>
        <span class="home-quick__label">구장 예약</span>
        <span class="home-quick__desc">탐색·시간 선택·결제까지</span>
      </span>
    </a>
    <a href="/blog/bloglist">
      <span class="home-quick__icon"><i class="bi bi-chat-square-text"></i></span>
      <span>
        <span class="home-quick__label">커뮤니티</span>
        <span class="home-quick__desc">블로그와 댓글로 소통</span>
      </span>
    </a>
    <a href="/notice/noticehome">
      <span class="home-quick__icon"><i class="bi bi-megaphone"></i></span>
      <span>
        <span class="home-quick__label">공지사항</span>
        <span class="home-quick__desc">운영 소식과 업데이트</span>
      </span>
    </a>
  </section>

</main>
</body>
</html>
