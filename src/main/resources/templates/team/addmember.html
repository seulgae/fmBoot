<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/popup_layout}">
<body>
<main class="popup-shell" layout:fragment="content">
  <div class="popup-card">
    <h1 class="page-head__title">팀원 추가</h1>
    <div class="form-grid form-grid--single">
      <div class="field">
        <label for="findMember">아이디 검색</label>
        <div class="action-row">
          <input class="input" type="text" id="findMember" placeholder="아이디 입력">
          <button class="btn btn--secondary" type="button" id="btnFind">검색</button>
        </div>
      </div>
    </div>
    <div id="memberList" class="u-mt-18"></div>
    <form id="frmAddMember" action="/teammanage/insertMember" method="post" class="u-mt-18">
      <input type="hidden" id="str_member" name="str_member">
      <input type="hidden" name="t_no" th:value="${t_no}">
      <div class="table-shell">
        <table class="data-table">
          <thead><tr><th>선택한 팀원</th><th>관리</th></tr></thead>
          <tbody id="selectedMembers"></tbody>
        </table>
      </div>
      <div class="action-row u-mt-18"><button class="btn btn--primary" type="button" id="submitMembers">등록</button></div>
    </form>
  </div>
</main>
<th:block layout:fragment="script">
  <script src="/js/pages/team-member.js" defer></script>
</th:block>
</body>
</html>
