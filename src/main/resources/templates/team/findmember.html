<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<div class="table-shell">
  <table class="data-table">
    <thead><tr><th>아이디</th><th>선택</th></tr></thead>
    <tbody>
      <tr th:each="member : ${findMem}">
        <td th:text="${member.m_id}"></td>
        <td><button class="btn btn--secondary" type="button" th:attr="data-member-id=${member.m_id}">추가</button></td>
      </tr>
    </tbody>
  </table>
</div>
</html>
