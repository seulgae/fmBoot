<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<body>
<main class="page-shell" layout:fragment="content">
  <section class="page-head">
    <div>
      <p class="page-head__subtitle">팀</p>
      <h1 class="page-head__title">팀 목록</h1>
    </div>
    <div class="page-head__actions">
      <input type="hidden" id="loginCheck" th:value="${session.m_id}">
      <form action="/teammanage/teammanage" class="action-row action-row--nowrap">
        <input class="input u-min-220" type="text" name="keyword" placeholder="팀명 검색">
        <button class="btn btn--secondary" type="submit">검색</button>
        <button class="btn btn--primary" type="button" id="teamCreateBtn">팀 생성</button>
      </form>
    </div>
  </section>
  <section class="table-shell">
    <table class="data-table">
      <thead>
        <tr>
          <th>팀 명</th>
          <th>경기</th>
          <th>승</th>
          <th>무</th>
          <th>패</th>
          <th>연고</th>
          <th>연령대</th>
          <th>실력</th>
          <th>유형</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="team : ${teamlist}" th:attr="data-team-row=${team.t_no}">
          <td><a th:href="|/teammanage/teamdetail?t_no=${team.t_no}|" th:text="${team.t_name}"></a></td>
          <td data-stat="all"></td>
          <td data-stat="win"></td>
          <td data-stat="draw"></td>
          <td data-stat="lose"></td>
          <td th:text="${team.t_region}"></td>
          <td th:text="${team.t_age}"></td>
          <td th:text="${team.t_skill}"></td>
          <td th:text="${team.t_kind}"></td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
<th:block layout:fragment="script">
  <script src="/js/pages/team-manage.js" defer></script>
</th:block>
</body>
</html>
