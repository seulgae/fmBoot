<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
  <main class="popup-shell">
    <div class="popup-card popup-card--narrow">
      <h1 class="page-head__title">팀 프로필 업로드</h1>
      <form action="/teammanage/addprofile" method="post" enctype="multipart/form-data" class="form-grid form-grid--single">
        <input type="hidden" name="t_no" th:value="${team.t_no}">
        <div class="field"><label for="t_thum">이미지 파일</label><input class="input" type="file" id="t_thum" name="t_thum"></div>
        <button class="btn btn--primary" type="submit">업로드</button>
      </form>
    </div>
  </main>
</body>
</html>
