<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<body>
<main class="page-shell" layout:fragment="content">
  <section class="page-head">
    <div>
      <p class="page-head__subtitle">팀 상세</p>
      <h1 class="page-head__title" th:text="${team.t_name}"></h1>
    </div>
    <div class="action-row">
      <input type="hidden" id="teamNo" th:value="${team.t_no}">
      <input type="hidden" id="loginCheck" th:value="${session.m_id}">
      <button class="btn btn--secondary" type="button" id="teamProfileBtn" th:if="${session.m_id != null and userCheck == 1}">프로필 선택</button>
      <button class="btn btn--secondary" type="button" id="teamMemberBtn" th:if="${session.m_id != null and userCheck == 1}">팀원 추가</button>
      <button class="btn btn--secondary" type="button" id="teamMatchBtn" th:if="${session.m_id != null and userCheck == 1}">전적 입력</button>
      <button class="btn btn--primary" type="button" id="teamUpdateBtn" th:if="${session.m_id != null and userCheck == 1}">팀 수정</button>
      <button class="btn btn--ghost" type="button" id="teamDeleteBtn" th:if="${session.m_id != null and (userCheck == 1 or session.m_id == 'admin')}">팀 삭제</button>
    </div>
  </section>
  <section class="grid grid--sidebar">
    <article class="panel">
      <div class="profile-box">
        <div class="profile-box__avatar">
          <img th:src="|/uploadImg/teamProfileImg/${team.t_thum}|" alt="team image">
        </div>
        <div>
          <div class="chip-list">
            <span class="chip" th:text="${team.t_region}"></span>
            <span class="chip" th:text="${team.t_age}"></span>
            <span class="chip" th:text="${team.t_skill}"></span>
            <span class="chip" th:text="${team.t_uniform}"></span>
            <span class="chip" th:text="${team.t_kind}"></span>
          </div>
          <p class="muted" th:text="|등록일 ${team.t_date}|"></p>
          <div class="notice-box" th:text="${team.t_introduce}"></div>
        </div>
      </div>
    </article>
    <article class="panel">
      <h2 class="section-title">팀원</h2>
      <ul class="list-plain">
        <li th:each="member : ${memberList}" th:text="${member}"></li>
      </ul>
    </article>
  </section>
  <section class="grid grid--cards u-mt-24">
    <article class="stat-card"><div class="stat-card__label">경기 수</div><div class="stat-card__value" th:text="${all}"></div></article>
    <article class="stat-card"><div class="stat-card__label">승 / 무 / 패</div><div class="stat-card__value" th:text="|${win}-${draw}-${lose}|"></div></article>
    <article class="stat-card"><div class="stat-card__label">승률</div><div class="stat-card__value" th:text="|${rate}%|"></div></article>
    <article class="stat-card"><div class="stat-card__label">득점 / 실점</div><div class="stat-card__value" th:text="|${gf}-${ga}|"></div></article>
  </section>
</main>
<th:block layout:fragment="script">
  <script src="/js/pages/team-detail.js" defer></script>
</th:block>
</body>
</html>
