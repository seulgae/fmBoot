<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/popup_layout}">
<body>
<main class="popup-shell" layout:fragment="content">
  <div class="popup-card popup-card--narrow">
    <h1 class="page-head__title">전적 입력</h1>
    <form action="/teammanage/gmatchinsert" method="post" class="form-grid form-grid--single">
      <input type="hidden" name="g_mno" th:value="${t_no}">
      <div class="field"><label for="g_vsno">상대팀 번호</label><input class="input" type="text" id="g_vsno" name="g_vsno"></div>
      <div class="field"><label for="g_game">승무패</label><select class="select" id="g_game" name="g_game"><option value="승">승</option><option value="무">무</option><option value="패">패</option></select></div>
      <div class="field"><label for="g_gf">득점</label><input class="input" type="number" id="g_gf" name="g_gf"></div>
      <div class="field"><label for="g_ga">실점</label><input class="input" type="number" id="g_ga" name="g_ga"></div>
      <div class="field"><label for="g_gamedate">경기일</label><input class="input" type="date" id="g_gamedate" name="g_gamedate"></div>
      <button class="btn btn--primary" type="submit">등록</button>
    </form>
  </div>
</main>
</body>
</html>
