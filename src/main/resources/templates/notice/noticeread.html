<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
<th:block th:replace="fragments/header :: headerFragment"></th:block>
<main class="page-shell">
  <section class="page-head">
    <div>
      <p class="page-head__subtitle">Announcement</p>
      <h1 class="page-head__title" th:text="${notices.n_title}"></h1>
    </div>
    <div class="action-row">
      <a class="btn btn--secondary" href="/notice/noticehome">목록</a>
      <a class="btn btn--primary" th:if="${m_id == 'admin'}" th:href="|/notice/noticemod/${notices.n_no}|">수정</a>
      <a class="btn btn--ghost" href="#" th:if="${m_id == 'admin'}" th:attr="data-confirm-url=|/notice/noticedelete/${notices.n_no}|" data-confirm-message="공지를 삭제하시겠습니까?">삭제</a>
    </div>
  </section>
  <article class="panel article">
    <div class="chip-list u-mb-18">
      <span class="chip" th:text="${notices.n_id}"></span>
      <span class="chip" th:text="${notices.n_date}"></span>
      <span class="chip" th:text="|조회 ${notices.n_count}|"></span>
    </div>
    <div th:text="${notices.n_content}"></div>
  </article>
</main>
<th:block th:replace="fragments/footer :: footerFragment"></th:block>
</body>
</html>
