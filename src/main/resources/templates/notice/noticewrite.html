<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
<th:block th:replace="fragments/header :: headerFragment"></th:block>
<main class="page-shell">
  <div class="panel">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">Announcement</p>
        <h1 class="page-head__title">Write Notice</h1>
      </div>
    </div>
    <form action="/notice/noticeinsert" method="post" class="form-grid form-grid--single">
      <div class="field">
        <label for="n_title">제목</label>
        <input class="input" type="text" id="n_title" name="n_title" required>
      </div>
      <div class="field">
        <label for="n_content">내용</label>
        <textarea class="textarea" id="n_content" name="n_content" required></textarea>
      </div>
      <div class="action-row">
        <button class="btn btn--primary" type="submit">등록</button>
        <button class="btn btn--secondary" type="button" data-go-back>취소</button>
      </div>
    </form>
  </div>
</main>
<th:block th:replace="fragments/footer :: footerFragment"></th:block>
</body>
</html>
