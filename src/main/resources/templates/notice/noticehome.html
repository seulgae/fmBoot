<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
<th:block th:replace="fragments/header :: headerFragment"></th:block>
<main class="page-shell">
  <section class="page-head">
    <div>
      <p class="page-head__subtitle">Announcements</p>
      <h1 class="page-head__title">Notice Board</h1>
    </div>
    <a class="btn btn--primary" href="/notice/noticewrite" th:if="${m_id == 'admin'}">공지 등록</a>
  </section>
  <section class="table-shell">
    <table class="data-table">
      <thead>
        <tr>
          <th>번호</th>
          <th>제목</th>
          <th>작성자</th>
          <th>등록일</th>
          <th>조회수</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="notice : ${notices}">
          <td th:text="${notice.rownum}"></td>
          <td><a th:href="|/notice/noticeread/${notice.n_no}|" th:text="${notice.n_title}"></a></td>
          <td th:text="${notice.n_id}"></td>
          <td th:text="${notice.n_date}"></td>
          <td th:text="${notice.n_count}"></td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
<th:block th:replace="fragments/footer :: footerFragment"></th:block>
</body>
</html>
