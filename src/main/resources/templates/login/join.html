<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<body>
<main class="page-shell join-shell" layout:fragment="content">
  <div class="panel join-card">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">계정</p>
        <h1 class="page-head__title">회원가입</h1>
      </div>
    </div>
    <form id="joinFrm" action="/login/joinInsert" method="post" class="join-form">
      <div class="join-form__row">
        <div class="field">
          <label for="m_id">아이디</label>
          <input class="input" type="text" id="m_id" name="m_id" placeholder="5자 이상 입력">
          <p id="idCheck" class="form-message">아이디를 입력해 주세요.</p>
        </div>
        <div class="field">
          <label for="m_name">이름</label>
          <input class="input" type="text" id="m_name" name="m_name" placeholder="이름">
        </div>
      </div>
      <div class="join-form__row">
        <div class="field">
          <label for="m_pw">비밀번호</label>
          <input class="input" type="password" id="m_pw" name="m_pw" placeholder="비밀번호">
        </div>
        <div class="field">
          <label for="m_pw_re">비밀번호 확인</label>
          <input class="input" type="password" id="m_pw_re" placeholder="비밀번호 확인">
          <p id="pwCheck" class="form-message">비밀번호를 두 번 입력해 주세요.</p>
        </div>
      </div>
      <div class="join-form__row">
        <div class="field">
          <label for="m_phone">전화번호</label>
          <input class="input" type="text" id="m_phone" name="m_phone" placeholder="010-0000-0000">
        </div>
        <div class="field">
          <label for="m_email">이메일</label>
          <input class="input" type="email" id="m_email" name="m_email" placeholder="name@example.com">
        </div>
      </div>
      <div class="join-form__row join-form__row--single">
        <div class="field field--full">
          <span class="check-group__label">가입 유형</span>
          <div class="check-inline">
            <label class="check"><input type="radio" name="m_level" value="1" checked> 일반 사용자</label>
            <label class="check"><input type="radio" name="m_level" value="2"> 구장 관리자</label>
          </div>
        </div>
      </div>
      <input type="hidden" name="m_cname" id="m_cname">
      <input type="hidden" name="m_pname" id="m_pname" value="teamDefault">
      <div class="join-form__row">
        <div class="field join-form__address">
          <label for="m_zip">우편번호</label>
          <div class="action-row">
            <input class="input" type="text" id="m_zip" name="m_zip" readonly>
            <button class="btn btn--secondary" type="button" id="zipBtn">주소 찾기</button>
          </div>
        </div>
        <div class="field">
          <label for="m_addr1">기본 주소</label>
          <input class="input" type="text" id="m_addr1" name="m_addr1" readonly>
        </div>
      </div>
      <div class="join-form__row join-form__row--single">
        <div class="field field--full">
          <label for="m_addr2">상세 주소</label>
          <input class="input" type="text" id="m_addr2" name="m_addr2">
        </div>
      </div>
      <div class="join-form__row manager-only" hidden>
        <div class="field manager-only" hidden>
          <label for="m_bank">은행명</label>
          <input class="input" type="text" id="m_bank" name="m_bank" placeholder="은행명">
        </div>
        <div class="field manager-only" hidden>
          <label for="m_account">계좌번호</label>
          <input class="input" type="text" id="m_account" name="m_account" placeholder="숫자만 입력">
        </div>
      </div>
      <div class="join-form__row join-form__row--single">
        <div class="field field--full">
          <div class="check-group">
            <label class="check"><input type="checkbox" id="uChk1"> 만 14세 이상입니다.</label>
            <label class="check"><input type="checkbox" id="uChk2"> 이용약관에 동의합니다.</label>
            <label class="check"><input type="checkbox" id="uChk3"> 개인정보 수집 및 이용에 동의합니다.</label>
          </div>
        </div>
      </div>
      <div class="join-form__row join-form__row--single">
        <div class="field field--full join-form__actions">
          <button class="btn btn--primary" type="button" id="joinBtn">가입하기</button>
          <button class="btn btn--secondary" type="button" data-go-back>취소</button>
        </div>
      </div>
    </form>
  </div>
</main>
<th:block layout:fragment="script">
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="/js/pages/join.js" defer></script>
</th:block>
</body>
</html>
