<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<body>
<main class="page-shell" layout:fragment="content">
  <div class="popup-card popup-card--narrow u-center-block">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">계정</p>
        <h1 class="page-head__title">로그인</h1>
      </div>
    </div>
    <form id="loginFrm" action="/login/loginOk" method="post" class="form-grid form-grid--single">
      <div class="field">
        <label for="m_id">아이디</label>
        <input class="input" type="text" id="m_id" name="m_id" placeholder="아이디를 입력해 주세요">
      </div>
      <div class="field">
        <label for="m_pw">비밀번호</label>
        <input class="input" type="password" id="m_pw" name="m_pw" placeholder="비밀번호를 입력해 주세요">
      </div>
      <div class="action-row">
        <button class="btn btn--primary" type="button" id="loginBtn">로그인</button>
        <a class="btn btn--secondary" href="/login/join">회원가입</a>
        <button class="btn btn--ghost" type="button" id="loginFind">아이디/비밀번호 찾기</button>
      </div>
    </form>
  </div>
</main>
<th:block layout:fragment="script">
  <script src="/js/pages/login.js" defer></script>
</th:block>
</body>
</html>
