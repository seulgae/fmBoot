<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/popup_layout}">
<body>
<main class="popup-shell" layout:fragment="content">
  <div class="popup-card">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">계정 찾기</p>
        <h1 class="page-head__title">아이디/비밀번호 찾기</h1>
      </div>
    </div>
    <div class="grid grid--cards">
      <section class="panel">
        <h2 class="section-title">아이디 찾기</h2>
        <div class="check-inline u-mt-16 u-mb-18">
          <label class="check"><input type="radio" name="findId" value="m_email" checked> 이메일로 찾기</label>
          <label class="check"><input type="radio" name="findId" value="m_phone"> 휴대폰으로 찾기</label>
        </div>
        <div class="field">
          <input class="input" type="text" id="findValue" placeholder="검색 값을 입력해 주세요">
        </div>
        <button class="btn btn--primary" type="button" id="btnFindId">아이디 찾기</button>
      </section>
      <section class="panel">
        <h2 class="section-title">비밀번호 찾기</h2>
        <div class="form-grid form-grid--single">
          <div class="field">
            <label for="pw_id">아이디</label>
            <input class="input" type="text" id="pw_id" placeholder="아이디">
          </div>
          <div class="field">
            <label for="pw_email">이메일</label>
            <input class="input" type="email" id="pw_email" placeholder="이메일">
          </div>
        </div>
        <button class="btn btn--primary" type="button" id="btnFindPw">비밀번호 찾기</button>
      </section>
    </div>
  </div>
</main>
<th:block layout:fragment="script">
  <script src="/js/pages/login.js" defer></script>
</th:block>
</body>
</html>
