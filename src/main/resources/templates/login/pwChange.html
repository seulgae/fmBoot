<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
<th:block th:replace="fragments/header :: headerFragment"></th:block>
<main class="page-shell">
  <div class="popup-card popup-card--narrow u-center-block">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">Password Reset</p>
        <h1 class="page-head__title">Change Password</h1>
      </div>
    </div>
    <form id="frmChange" action="/login/pwChangeDo" method="post" class="form-grid form-grid--single">
      <input type="hidden" name="m_id" th:value="${m_id}">
      <div class="field">
        <label for="m_pw">새 비밀번호</label>
        <input class="input" type="password" id="m_pw" name="m_pw">
      </div>
      <div class="field">
        <label for="m_pw1">새 비밀번호 확인</label>
        <input class="input" type="password" id="m_pw1">
      </div>
      <div class="action-row">
        <button class="btn btn--primary" type="button" id="btnChange">변경하기</button>
      </div>
    </form>
  </div>
</main>
<script src="/js/pages/login.js" defer></script>
<th:block th:replace="fragments/footer :: footerFragment"></th:block>
</body>
</html>
