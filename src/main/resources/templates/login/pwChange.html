<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<body>
<main class="page-shell" layout:fragment="content">
  <div class="popup-card popup-card--narrow u-center-block">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">계정</p>
        <h1 class="page-head__title">비밀번호 변경</h1>
      </div>
    </div>
    <form id="frmChange" action="/login/pwChangeDo" method="post" class="form-grid form-grid--single">
      <input type="hidden" name="m_id" th:value="${m_id}">
      <div class="field">
        <label for="m_pw">새 비밀번호</label>
        <input class="input" type="password" id="m_pw" name="m_pw">
      </div>
      <div class="field">
        <label for="m_pw1">새 비밀번호 확인</label>
        <input class="input" type="password" id="m_pw1">
      </div>
      <div class="action-row">
        <button class="btn btn--primary" type="button" id="btnChange">변경하기</button>
      </div>
    </form>
  </div>
</main>
<th:block layout:fragment="script">
  <script src="/js/pages/login.js" defer></script>
</th:block>
</body>
</html>
