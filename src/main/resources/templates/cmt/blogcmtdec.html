<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<div class="panel">
  <h2 class="section-title">신고된 댓글</h2>
  <div class="comment-list u-mt-18">
    <div class="comment-item" th:each="cment : ${cments}">
      <div class="comment-item__head">
        <div>
          <strong th:text="${cment.c_c_id}"></strong>
          <span class="muted" th:text="${cment.c_date}"></span>
        </div>
        <button class="btn btn--secondary" type="button" th:attr="data-comment-delete=|/cmt/cmddelete/${cment.c_no}|">삭제</button>
      </div>
      <p th:text="${cment.c_content}"></p>
    </div>
  </div>
</div>
</html>
