<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<div class="panel">
  <h2 class="section-title">댓글</h2>
  <div class="comment-list u-mt-18">
    <div class="comment-item" th:each="cment : ${cments}">
      <div class="comment-item__head">
        <div>
          <strong th:text="${cment.c_c_id}"></strong>
          <span class="muted" th:text="${cment.c_date}"></span>
        </div>
        <div class="inline-actions">
          <a class="btn btn--ghost" th:href="|/cmt/dec/${cment.c_no}|">신고</a>
          <button class="btn btn--secondary" type="button" th:if="${cment.c_c_id.equals(m_id) or session.m_id == 'admin'}" th:attr="data-comment-delete=|/cmt/cmddelete/${cment.c_no}|">삭제</button>
        </div>
      </div>
      <p th:text="${cment.c_content}"></p>
    </div>
    <div class="empty-state" th:if="${#lists.isEmpty(cments)}">등록된 댓글이 없습니다.</div>
  </div>
</div>
</html>
