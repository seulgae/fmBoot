<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
<th:block th:replace="fragments/header :: headerFragment"></th:block>
<main class="page-shell">
  <section class="page-head">
    <div>
      <p class="page-head__subtitle">My Dashboard</p>
      <h1 class="page-head__title">Mypage</h1>
    </div>
    <div class="action-row">
      <button class="btn btn--secondary" type="button" id="profileOpen">프로필 사진</button>
      <button class="btn btn--secondary" type="button" id="reservationOpen" th:if="${member.m_level.equals('2')}">예약 현황</button>
      <a class="btn btn--primary" th:href="|/mypage/Information_update/${session.m_id}|">정보 수정</a>
      <a class="btn btn--primary" href="/mypage/mypage_request" th:if="${member.m_level.equals('2')}">구장 등록</a>
    </div>
  </section>

  <section class="panel u-mt-24">
    <div class="profile-box">
      <div class="profile-box__avatar">
        <img th:src="|/uploadImg/profileImg/${member.m_thum}|" alt="profile">
      </div>
      <div>
        <h2 class="section-title" th:text="${member.m_name}"></h2>
        <div class="chip-list u-mt-12">
          <span class="chip" th:text="${member.m_email}"></span>
          <span class="chip" th:text="${member.m_phone}"></span>
          <span class="chip" th:text="${member.m_level.equals('2') ? '구장 관리자' : '일반 사용자'}"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="table-shell" th:if="${member.m_level.equals('1')}">
    <table class="data-table">
      <thead>
        <tr>
          <th>번호</th>
          <th>구장명</th>
          <th>예약 시간</th>
          <th>예약 날짜</th>
          <th>결제 날짜</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${list1}">
          <td th:text="${item.rownum}"></td>
          <td><a th:href="|/payment/placeread?p_no=${item.r_p_no}|" th:text="${item.p_pname}"></a></td>
          <td th:text="${item.r_time}"></td>
          <td th:text="${item.r_date}"></td>
          <td th:text="${item.r_wdate}"></td>
        </tr>
      </tbody>
    </table>
  </section>

  <section class="table-shell" th:if="${member.m_level.equals('2') or member.m_level.equals('0')}">
    <table class="data-table">
      <thead>
        <tr>
          <th>번호</th>
          <th>구장명</th>
          <th>등록일</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${list}">
          <td th:text="${item.rownum}"></td>
          <td><a th:href="|/payment/placeread?p_no=${item.p_no}|" th:text="${item.p_pname}"></a></td>
          <td th:text="${item.p_date}"></td>
          <td class="inline-actions">
            <a class="btn btn--secondary" th:href="|/mypage/mypage_update/${item.p_no}|">수정</a>
            <a class="btn btn--ghost" href="#" th:attr="data-confirm-url=|/mypage/place_delete/${item.p_no}|" data-confirm-message="구장을 삭제하시겠습니까?">삭제</a>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
<script src="/js/pages/mypage.js" defer></script>
<th:block th:replace="fragments/footer :: footerFragment"></th:block>
</body>
</html>
