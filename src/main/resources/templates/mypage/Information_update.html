<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
<th:block th:replace="fragments/header :: headerFragment"></th:block>
<main class="page-shell">
  <div class="panel">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">Profile Settings</p>
        <h1 class="page-head__title">정보 수정</h1>
      </div>
    </div>
    <form action="/mypage/Information_update.do" method="post" class="form-grid">
      <input type="hidden" name="m_id" th:value="${dto.m_id}">
      <div class="field">
        <label>아이디</label>
        <input class="input" type="text" th:value="${dto.m_id}" readonly>
      </div>
      <div class="field">
        <label for="m_pw">비밀번호</label>
        <input class="input" type="password" id="m_pw" name="m_pw">
      </div>
      <div class="field">
        <label for="m_name">이름</label>
        <input class="input" type="text" id="m_name" name="m_name" th:value="${dto.m_name}">
      </div>
      <div class="field">
        <label for="m_phone">전화번호</label>
        <input class="input" type="text" id="m_phone" name="m_phone" th:value="${dto.m_phone}">
      </div>
      <div class="field">
        <label for="m_email">이메일</label>
        <input class="input" type="text" id="m_email" name="m_email" th:value="${dto.m_email}">
      </div>
      <div class="field">
        <label for="m_zip">우편번호</label>
        <input class="input" type="text" id="m_zip" name="m_zip" th:value="${dto.m_zip}">
      </div>
      <div class="field field--full">
        <label for="m_addr1">주소</label>
        <input class="input" type="text" id="m_addr1" name="m_addr1" th:value="${dto.m_addr1}">
      </div>
      <div class="field field--full">
        <label for="m_addr2">상세 주소</label>
        <input class="input" type="text" id="m_addr2" name="m_addr2" th:value="${dto.m_addr2}">
      </div>
      <div class="field">
        <label for="m_pname">대표명</label>
        <input class="input" type="text" id="m_pname" name="m_pname" th:value="${dto.m_pname}">
      </div>
      <div class="field">
        <label for="m_bank">은행명</label>
        <input class="input" type="text" id="m_bank" name="m_bank" th:value="${dto.m_bank}">
      </div>
      <div class="field field--full">
        <label for="m_account">계좌번호</label>
        <input class="input" type="text" id="m_account" name="m_account" th:value="${dto.m_account}">
      </div>
      <div class="field field--full action-row">
        <button class="btn btn--primary" type="submit">저장</button>
        <button class="btn btn--secondary" type="button" data-go-back>취소</button>
      </div>
    </form>
  </div>
</main>
<th:block th:replace="fragments/footer :: footerFragment"></th:block>
</body>
</html>
