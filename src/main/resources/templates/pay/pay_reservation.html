<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<body>
<main class="page-shell" layout:fragment="content">
  <div class="panel">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">결제</p>
        <h1 class="page-head__title">예약 결제</h1>
      </div>
    </div>
    <div class="grid grid--sidebar">
      <section class="panel">
        <h2 class="section-title">예약 정보</h2>
        <div class="chip-list u-mt-16">
          <span class="chip" th:text="${p_info.p_pname}"></span>
          <span class="chip" th:text="${dateSet}"></span>
          <span class="chip" th:text="${time}"></span>
          <span class="chip" th:text="|${p_info.p_price}원|"></span>
        </div>
        <div class="notice-box u-mt-18">개인정보 제3자 제공 및 시설 이용 규정에 동의해야 결제를 진행할 수 있습니다.</div>
      </section>
      <section class="panel">
        <h2 class="section-title">결제자 정보</h2>
        <p class="muted" th:text="|이름 ${member.m_name}|"></p>
        <p class="muted" th:text="|연락처 ${member.m_phone}|"></p>
        <p class="muted" th:text="|이메일 ${member.m_email}|"></p>
        <div class="check-group u-mt-18">
          <label class="check"><input type="checkbox" id="chk1"> 개인정보 제공에 동의합니다.</label>
          <label class="check"><input type="checkbox" id="chk2"> 시설 이용 규정에 동의합니다.</label>
        </div>
      </section>
    </div>
    <form method="post" action="/payment/kakaoPay" id="frmPay" class="u-mt-24">
      <input type="hidden" id="payPlaceName" th:value="${p_info.p_pname}">
      <input type="hidden" id="payPrice" th:value="${p_info.p_price}">
      <input type="hidden" id="payEmail" th:value="${member.m_email}">
      <input type="hidden" id="payName" th:value="${member.m_name}">
      <input type="hidden" id="payPhone" th:value="${member.m_phone}">
      <input type="hidden" id="payPlaceNo" th:value="${p_info.p_no}">
      <input type="hidden" id="payMemberId" th:value="${member.m_id}">
      <input type="hidden" name="r_m_id" th:value="${session.m_id}">
      <input type="hidden" name="r_p_no" th:value="${p_no}">
      <input type="hidden" name="r_time" th:value="${time}">
      <input type="hidden" name="r_date" th:value="${dateSet}">
      <div class="action-row u-justify-end">
        <button class="btn btn--primary" id="payBtn" type="button">결제하기</button>
      </div>
    </form>
  </div>
</main>
<th:block layout:fragment="script">
  <script src="https://cdn.iamport.kr/js/iamport.payment-1.1.5.js"></script>
  <script src="/js/pages/pay-reservation.js" defer></script>
</th:block>
</body>
</html>
