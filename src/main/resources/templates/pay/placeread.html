<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
<th:block th:replace="fragments/header :: headerFragment"></th:block>
<main class="page-shell">
  <section class="page-head">
    <div>
      <p class="page-head__subtitle">Venue Booking</p>
      <h1 class="page-head__title" th:text="${place.p_pname}"></h1>
    </div>
    <div class="chip-list">
      <span class="chip" th:text="${place.p_place}"></span>
      <a class="btn btn--secondary" th:href="|https://map.naver.com/v5/search/${place.p_place}|" target="_blank" rel="noopener">길찾기</a>
    </div>
  </section>

  <section class="media-strip">
    <div>
      <div class="gallery-main"><img id="mainImg" th:src="${firstImg}" alt="main image"></div>
      <div class="thumb-grid u-mt-12">
        <button class="thumb" type="button" th:each="img : ${arrImg}" th:attr="data-gallery-thumb=${img}">
          <img th:src="${img}" alt="thumbnail">
        </button>
      </div>
    </div>
    <aside class="detail-card">
      <h2 class="section-title">구장 정보</h2>
      <div class="chip-list u-mt-16 u-mb-18">
        <span class="chip" th:classappend="${place.p_op1 == '1'} ? ' is-on'">주차</span>
        <span class="chip" th:classappend="${place.p_op2 == '1'} ? ' is-on'">냉난방</span>
        <span class="chip" th:classappend="${place.p_op3 == '1'} ? ' is-on'">공 대여</span>
        <span class="chip" th:classappend="${place.p_op4 == '1'} ? ' is-on'">조끼 대여</span>
        <span class="chip" th:classappend="${place.p_op5 == '1'} ? ' is-on'">실내화</span>
        <span class="chip" th:classappend="${place.p_op6 == '1'} ? ' is-on'">샤워실</span>
      </div>
      <p class="muted">가격: <strong th:text="|${#numbers.formatInteger(place.p_price,3,'COMMA')}원|"></strong></p>
      <p class="muted">최대 인원: <strong th:text="${place.p_max}"></strong></p>
      <p class="muted">지역: <strong th:text="${place.p_area}"></strong></p>
    </aside>
  </section>

  <section class="panel u-mt-24">
    <form id="frmReservation" action="/payment/pay_reservation" method="post">
      <input type="hidden" id="loginCheck" th:value="${session.m_id}">
      <input type="hidden" id="p_no" name="p_no" th:value="${place.p_no}">
      <input type="hidden" id="time" name="time">
      <div class="field u-max-280 u-mb-18">
        <label for="dateSet">예약 날짜</label>
        <input class="input" type="date" id="dateSet" name="dateSet" th:min="${today}" th:value="${today}">
      </div>
      <div class="legend">
        <span class="legend__available">예약 가능</span>
        <span class="legend__disabled">예약 불가</span>
        <span class="legend__selected">현재 선택</span>
      </div>
      <div class="slot-grid">
        <button class="slot" type="button" data-slot="12:00~14:00" data-ends="14:00">12:00~14:00</button>
        <button class="slot" type="button" data-slot="14:00~16:00" data-ends="16:00">14:00~16:00</button>
        <button class="slot" type="button" data-slot="16:00~18:00" data-ends="18:00">16:00~18:00</button>
        <button class="slot" type="button" data-slot="18:00~20:00" data-ends="20:00">18:00~20:00</button>
        <button class="slot" type="button" data-slot="20:00~22:00" data-ends="22:00">20:00~22:00</button>
      </div>
      <div class="action-row u-mt-18 u-align-center u-space-between">
        <strong th:text="|총 결제 금액 ${#numbers.formatInteger(place.p_price,3,'COMMA')}원|"></strong>
        <button class="btn btn--primary" type="button" id="btnReservation">예약 요청하기</button>
      </div>
    </form>
  </section>

  <section class="grid grid--sidebar u-mt-24">
    <article class="panel article">
      <h2 class="section-title">상세 설명</h2>
      <div th:utext="${place.p_explain}"></div>
    </article>
    <article class="panel">
      <h2 class="section-title">이용 안내</h2>
      <div class="notice-box">예약 날짜 기준으로 환불 규정이 적용됩니다.
당일 취소 및 노쇼는 환불되지 않습니다.
실내 구장 사용 시 시설물 보호를 위해 지정된 신발만 착용해 주세요.</div>
    </article>
  </section>
</main>
<script src="/js/pages/place-read.js" defer></script>
<th:block th:replace="fragments/footer :: footerFragment"></th:block>
</body>
</html>
