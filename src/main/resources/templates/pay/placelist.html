<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/config :: configFragment"></th:block>
<body>
<th:block th:replace="fragments/header :: headerFragment"></th:block>
<main class="page-shell">
  <section class="page-head">
    <div>
      <p class="page-head__subtitle">Venue Booking</p>
      <h1 class="page-head__title">Place List</h1>
    </div>
    <form action="/payment/placelist" class="action-row">
      <input class="input u-min-240" type="text" name="keyword" placeholder="구장명 검색">
      <button class="btn btn--secondary" type="submit">검색</button>
    </form>
  </section>
  <form action="/payment/placelist">
    <section class="grid grid--cards">
      <article class="item-card" th:each="item : ${lists}">
        <a class="item-card__media" th:href="|/payment/placeread?p_no=${item.p_no}|">
          <img th:src="${item.mainImg}" alt="place image">
        </a>
        <div class="item-card__body">
          <h2 class="item-card__title" th:text="${item.p_pname}"></h2>
          <p class="item-card__content" th:text="${item.p_place}"></p>
          <div class="chip-list u-mt-16 u-mb-18">
            <span class="chip">6vs6</span>
            <span class="chip" th:classappend="${item.p_op1 == '1'} ? ' is-on'" >주차</span>
            <span class="chip" th:classappend="${item.p_op2 == '1'} ? ' is-on'" >냉난방</span>
            <span class="chip" th:classappend="${item.p_op3 == '1'} ? ' is-on'" >공 대여</span>
            <span class="chip" th:classappend="${item.p_op4 == '1'} ? ' is-on'" >조끼 대여</span>
            <span class="chip" th:classappend="${item.p_op5 == '1'} ? ' is-on'" >실내화</span>
            <span class="chip" th:classappend="${item.p_op6 == '1'} ? ' is-on'" >샤워실</span>
          </div>
          <a class="btn btn--primary btn--block" th:href="|/payment/placeread?p_no=${item.p_no}|">예약 보기</a>
        </div>
      </article>
    </section>
    <div class="u-mt-24 u-text-center">
      <input type="hidden" name="pageAdd" value="5">
      <button class="btn btn--secondary" type="submit">더 보기</button>
    </div>
  </form>
</main>
<th:block th:replace="fragments/footer :: footerFragment"></th:block>
</body>
</html>
