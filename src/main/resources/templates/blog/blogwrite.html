<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">
<body>
<main class="page-shell" layout:fragment="content">
  <div class="panel">
    <div class="page-head">
      <div>
        <p class="page-head__subtitle">커뮤니티</p>
        <h1 class="page-head__title">글 쓰기</h1>
      </div>
    </div>
    <form action="/blog/blogwriteaction" method="post" enctype="multipart/form-data" class="form-grid form-grid--single">
      <input type="hidden" name="tb_id" th:value="${tb_id}">
      <div class="field">
        <label>작성자</label>
        <input class="input" type="text" th:value="${tb_id}" readonly>
      </div>
      <div class="field">
        <label for="tb_title">제목</label>
        <input class="input" type="text" id="tb_title" name="tb_title" required>
      </div>
      <div class="field">
        <label for="tb_content">내용</label>
        <textarea class="textarea" id="tb_content" name="tb_content" required></textarea>
      </div>
      <div class="field">
        <label for="tb_thum">대표 이미지</label>
        <input class="input" type="file" id="tb_thum" name="tb_thum">
        <img id="blogPreview" hidden alt="preview" class="u-max-280 u-radius-md">
      </div>
      <div class="action-row">
        <button class="btn btn--primary" type="submit">등록</button>
        <button class="btn btn--secondary" type="button" data-go-back>취소</button>
      </div>
    </form>
  </div>
</main>
<th:block layout:fragment="script">
  <script src="/js/pages/blog.js" defer></script>
</th:block>
</body>
</html>
