<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FM Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b3242d"/>
      <stop offset="100%" stop-color="#540b11"/>
    </linearGradient>
  </defs>
  <!-- 전체 영역 브랜드 컬러로 채워 Android maskable 마스킹에서 여백 없도록 함 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 안전영역(안쪽 80%) 내부에 로고 배치 -->
  <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle"
        font-family="Arial Black, Impact, 'Oswald', sans-serif"
        font-weight="900" font-size="180" letter-spacing="4"
        fill="#fff6f2">FM</text>
</svg>
