name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build package
        run: ./mvnw -B -DskipTests package

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: target/fm-0.0.1-SNAPSHOT.jar
          target: /home/seulgae/fmBoot-deploy
          strip_components: 1

      - name: Restart app container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            printf '%s\n' '${{ secrets.SERVER_SUDO_PASSWORD }}' | sudo -S mkdir -p /home/seulgae/fmBoot-deploy
            printf '%s\n' '${{ secrets.SERVER_SUDO_PASSWORD }}' | sudo -S chown seulgae:seulgae /home/seulgae/fmBoot-deploy/fm-0.0.1-SNAPSHOT.jar
            printf '%s\n' '${{ secrets.SERVER_SUDO_PASSWORD }}' | sudo -S podman pull docker.io/library/eclipse-temurin:17-jre
            printf '%s\n' '${{ secrets.SERVER_SUDO_PASSWORD }}' | sudo -S podman rm -f fm-app || true
            printf '%s\n' '${{ secrets.SERVER_SUDO_PASSWORD }}' | sudo -S podman run -d \
              --name fm-app \
              --restart=always \
              -p 8085:8085 \
              -v /home/seulgae/fmBoot-deploy/fm-0.0.1-SNAPSHOT.jar:/app/app.jar:ro,Z \
              -v /home/seulgae/fmBoot-runtime/application.properties:/app/config/application.properties:ro,Z \
              docker.io/library/eclipse-temurin:17-jre \
              java -jar /app/app.jar --spring.config.location=file:/app/config/application.properties
            sleep 15
            printf '%s\n' '${{ secrets.SERVER_SUDO_PASSWORD }}' | sudo -S podman ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            curl -I -s http://127.0.0.1:8085/ | head -n 10
