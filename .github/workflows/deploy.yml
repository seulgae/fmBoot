name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fmboot-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build package
        run: ./mvnw -B -DskipTests package

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmboot-jar
          path: target/fm-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    needs: build
    runs-on:
      - self-hosted
      - linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: fmboot-jar
          path: .artifacts

      - name: Deploy on self-hosted runner
        shell: bash
        env:
          ARTIFACT_PATH: ${{ github.workspace }}/.artifacts/fm-0.0.1-SNAPSHOT.jar
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          DEPLOY_ROOT: /home/seulgae/fmBoot-deploy
          APP_CONFIG_PATH: /home/seulgae/fmBoot-runtime/application.properties
          APP_CONTAINER_NAME: fm-app
          CONTAINER_IMAGE: docker.io/library/eclipse-temurin:17-jre
          APP_PORT: "8085"
        run: bash scripts/deploy-self-hosted.sh
